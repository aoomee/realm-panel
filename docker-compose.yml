services:
  realm:
    build: ./realm-container    # builds from GitHub Releases binary, no registry auth needed
    container_name: realm
    restart: unless-stopped
    network_mode: host          # realm needs full host networking for port binding
    volumes:
      - realm_data:/etc/realm
    command: ["-c", "/etc/realm/config.json"]

  panel:
    build:
      context: .                       # repo root: bundles realm-agent/ for remote installs
      dockerfile: realm-panel/Dockerfile
    container_name: realm-panel
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      - realm_data:/etc/realm
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - RULES_DIR=/etc/realm/rules
      - META_PATH=/etc/realm/panel/vps_meta.json
      - CONFIG_JSON=/etc/realm/config.json
      - REALM_BACKEND=docker
      - REALM_CONTAINER=realm
      - WEIGHT_INTERVAL=60       # recompute weights every 60 s
      - WEIGHT_MAX_DAYS=30       # days until expiry that maps to score=1.0
      - WEIGHT_W_DAYS=0.5        # weight factor: expiry component
      - WEIGHT_W_TRAFFIC=0.5     # weight factor: traffic component
      - MONITOR_INTERVAL=30      # host probe interval (seconds)
      - MONITOR_TIMEOUT=3        # TCP probe timeout (seconds)
      - MONITOR_RING=20          # latency history ring size per host
      - MONITOR_PATH=/etc/realm/panel/monitor.json
      - NODES_PATH=/etc/realm/panel/nodes.json   # remote agent registry
      - NODE_PUSH_TIMEOUT=8      # per-node HTTP push timeout (seconds)
      - LINES_PATH=/etc/realm/panel/lines.json   # 线路 registry
      - LINE_PORT_MIN=20000      # auto-assigned line port range
      - LINE_PORT_MAX=59999
      - PANEL_PASSWORD=          # 强烈建议设置！面板登录密码（用户名 admin），留空 = 不鉴权
      - PANEL_PUBLIC_HOST=       # A 机公网 IP/域名：本机做中转时的入口地址（可留空）
    depends_on:
      - realm

volumes:
  realm_data:
